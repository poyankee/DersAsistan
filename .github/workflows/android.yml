name: Android APK
on:
  push:
    branches: [main, 'ccr-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../DersAsistani.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DersAsistani-apk
          path: DersAsistani.apk
      - name: Releases sayfasında yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.${{ github.run_number }}
          name: Ders Asistanı 0.5.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: DersAsistani.apk
          body: |
            Telefona/tablete kurmak için aşağıdaki **DersAsistani.apk** dosyasını indirip açın.
            İlk kurulumda "Bilinmeyen kaynaklardan yüklemeye izin ver" demeniz gerekebilir.

            **Güncellerken (deneme sürümü):** "Uygulama yüklenmedi" uyarısı alırsanız önce uygulamada
            Ayarlar → Yedek indir yapın, eski uygulamayı silip yenisini kurun, sonra Ayarlar → Yedekten geri yükle.

            Dal: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
