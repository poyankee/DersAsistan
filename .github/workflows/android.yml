name: Android APK
on:
  push:
    branches: [main, 'ccr-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          SIGNED=hayir
          if [ -n "$KEYSTORE_B64" ]; then
            # Kopyala-yapıştırdan gelen boşluk/satır sonu/tırnakları temizle
            CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')
            KEYSTORE_PW=$(printf '%s' "$KEYSTORE_PW" | tr -d ' \r\n\t')
            echo "Anahtar metni uzunluğu: ${#CLEAN} karakter (beklenen ~3500)"
            if printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.keystore" 2>/dev/null \
               && keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PW" >/dev/null 2>&1; then
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
              SIGNED=evet
            else
              echo "::warning::İmza anahtarı okunamadı (ANDROID_KEYSTORE_BASE64 eksik/hatalı veya şifre yanlış). APK geçici anahtarla imzalanacak."
            fi
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret'i yok. APK geçici anahtarla imzalanacak."
          fi
          echo "SIGNED=$SIGNED" >> "$GITHUB_ENV"
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../DersAsistani.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DersAsistani-apk
          path: DersAsistani.apk
      - name: Releases sayfasında yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.${{ github.run_number }}
          name: Ders Asistanı 0.5.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ env.SIGNED == 'evet' }}
          prerelease: ${{ env.SIGNED != 'evet' }}
          files: DersAsistani.apk
          body: |
            Telefona/tablete kurmak için aşağıdaki **DersAsistani.apk** dosyasını indirip açın.
            İlk kurulumda "Bilinmeyen kaynaklardan yüklemeye izin ver" demeniz gerekebilir.
            ${{ env.SIGNED == 'evet' && 'Yeni sürümler eskisinin üzerine kurulur, verileriniz silinmez.' || '⚠️ Bu sürüm geçici anahtarla imzalandı: sonraki sürümler üstüne kurulamaz. Kalıcı imza için README dosyasındaki adımlarla GitHub Secrets ekleyin.' }}

            Dal: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
