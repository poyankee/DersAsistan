name: Android APK
on:
  push:
    branches: [main, 'ccr-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      # Güncellemelerin eskisinin üzerine kurulabilmesi için imza anahtarı derlemeler arasında saklanır.
      # (Depoya konmaz. Önbellek 7 gün hiç kullanılmazsa GitHub tarafından silinir; o zaman yeni anahtar üretilir.)
      - name: İmza anahtarını önbellekten al
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: İmza anahtarı yoksa üret
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "::warning::Yeni imza anahtarı üretildi: bu sürüm öncekinin üzerine kurulamaz (bir kerelik yedek al / sil / kur gerekir)."
      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../DersAsistani.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DersAsistani-apk
          path: DersAsistani.apk
      - name: Releases sayfasında yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.${{ github.run_number }}
          name: Ders Asistanı 0.7.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: DersAsistani.apk
          body: |
            Telefona/tablete kurmak için aşağıdaki **DersAsistani.apk** dosyasını indirip açın.
            İlk kurulumda "Bilinmeyen kaynaklardan yüklemeye izin ver" demeniz gerekebilir.

            **Güncellerken:** Bu sürümden itibaren APK'lar aynı anahtarla imzalanır ve eskisinin üzerine kurulur.
            "Uygulama yüklenmedi" uyarısı alırsanız (ilk geçişte bir kez olur): Ayarlar → Yedek indir,
            eski uygulamayı silip yenisini kurun, sonra Ayarlar → Gelişmiş → Yedekten geri yükle.

            Dal: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
