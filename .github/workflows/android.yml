name: Android APK
on:
  push:
    # Tek daldan derlenir: imza anahtarı önbelleği dala bağlıdır, iki daldan derlemek farklı imzalı APK üretir
    branches: ['ccr-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Uçtan uca testler (gerçek tarayıcıda)
        run: |
          # Ubuntu paket sunucusuna erişim anlık kesilirse birkaç kez dene
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; echo "Yeniden deneniyor ($i)"; sleep 20; done
          npm run e2e
      - name: Uygulama içi güncelleme paketi (web-N.zip + surum.json)
        id: upd
        run: |
          node scripts/make-update.mjs update
          echo "tag=$(node -p "require('./update/surum.json').tag")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./update/surum.json').version")" >> "$GITHUB_OUTPUT"
      - run: npx cap sync android
      # Güncellemelerin eskisinin üzerine kurulabilmesi için imza anahtarı derlemeler arasında saklanır.
      # (Depoya konmaz. keystore-keepalive.yml önbelleği canlı tutar.)
      - name: İmza anahtarını önbellekten al
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/da-signing/app.keystore
          key: app-keystore-v2
      - name: İmza anahtarı yoksa üret
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/da-signing
          rm -f ~/da-signing/app.keystore
          keytool -genkeypair -keystore ~/da-signing/app.keystore -storetype JKS -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 18250 -dname "CN=Ders Asistani,O=DersAsistani,C=TR"
          echo "::warning::Yeni imza anahtarı üretildi: bu sürüm öncekinin üzerine kurulamaz (bir kerelik yedek al / sil / kur gerekir)."
      - name: APK derle
        working-directory: android
        env:
          DA_VERSION_NAME: ${{ steps.upd.outputs.version }}
        run: |
          export DA_KEYSTORE="$HOME/da-signing/app.keystore"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../DersAsistani.apk
      - name: APK'nın saklanan anahtarla imzalandığını doğrula
        run: |
          want=$(keytool -list -v -keystore ~/da-signing/app.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile DersAsistani.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Anahtar: $want"
          echo "APK:     $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then echo "::error::APK saklanan anahtarla imzalanmamış"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: DersAsistani-apk
          path: DersAsistani.apk
      - name: Releases sayfasında yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upd.outputs.tag }}
          name: Ders Asistanı ${{ steps.upd.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            DersAsistani.apk
            update/web-*.zip
            update/surum.json
          body: |
            Telefona/tablete kurmak için aşağıdaki **DersAsistani.apk** dosyasını indirip açın.
            İlk kurulumda "Bilinmeyen kaynaklardan yüklemeye izin ver" demeniz gerekebilir.

            **Güncellemeler:** v0.11 ve sonrası kuruluysa yenilikler uygulamanın içinden kendiliğinden gelir; bu sayfaya gelmeniz gerekmez.
            APK'lar aynı anahtarla imzalanır; elle kurarsanız da eskisinin üzerine kurulur, veriler silinmez.

            Dal: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
