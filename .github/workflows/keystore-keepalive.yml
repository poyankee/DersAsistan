name: İmza anahtarını canlı tut
# GitHub, 7 gün hiç kullanılmayan önbelleği siler. Bu iş akışı imza anahtarının önbelleğine
# üç günde bir erişerek silinmesini önler; böylece her APK aynı anahtarla imzalanır ve
# güncellemeler eskisinin üzerine kurulur.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - id: keystore
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - run: |
          if [ "${{ steps.keystore.outputs.cache-hit }}" = "true" ]; then
            echo "İmza anahtarı önbellekte duruyor."
          else
            echo "::warning::İmza anahtarı önbellekte bulunamadı; bir sonraki derleme yeni anahtar üretecek."
          fi
