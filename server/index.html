<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ders Asistanı sunucusu</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#16142b}code{background:#f1effc;padding:2px 6px;border-radius:6px}</style></head>
<body><h1>Ders Asistanı eşitleme sunucusu</h1>
<p id="d">Denetleniyor…</p>
<p>Uygulamada <b>Ayarlar → Eşitleme</b> bölümüne sunucu adresi olarak bu sayfanın adresini yazın.</p>
<script>
fetch('api.php?a=durum').then(r=>r.json()).then(j=>{document.getElementById('d').textContent=j.ok?('Sunucu çalışıyor ✓ (PHP '+j.php+')'+(j.setup?' · hesap kurulu':' · hesap henüz kurulmadı')):('Hata: '+j.error)}).catch(()=>{document.getElementById('d').textContent='api.php çalışmıyor. PHP etkin mi?'})
</script></body></html>
